[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"

[variables]
DATABASE_PATH = "/data/vintage_ops.sqlite3"
UPLOAD_DIRECTORY = "/data/uploads"
BACKUP_DIRECTORY = "/data/backups"
APP_ENVIRONMENT = "sandbox"
STRIPE_PROVIDER_MODE = "test"
EBAY_PROVIDER_MODE = "sandbox"
PROXY_FIX_PROTO = "1"
PROXY_FIX_HOST = "1"

# The daily backup caller is a separate Railway cron service (15 3 * * *).
# It runs scripts/run_scheduled_backup.py without a volume. Bucket credentials
# and BACKUP_ENCRYPTION_KEY belong only to this web service and are configured
# as private Railway variables, never committed here.
