<!doctype html><meta charset="utf-8"><title>Semantic controls</title>
<form aria-label="Synthetic listing">
 <label for="title">Item title</label><input id="title" name="title">
 <label>Condition <select name="condition"><option>Pre-owned - Excellent</option><option>Pre-owned - Good</option></select></label>
 <fieldset><legend>Vintage</legend><label><input type="radio" name="vintage" value="yes">Yes</label><label><input type="radio" name="vintage" value="no">No</label></fieldset>
 <label for="photos">Photos &amp; video</label><input id="photos" type="file" multiple>
 <label for="description">Description</label><textarea id="description"></textarea>
 <button type="button" aria-haspopup="listbox">Brand</button><div role="listbox" hidden><div role="option">Levi's</div></div>
 <button type="submit">List it</button>
</form>
