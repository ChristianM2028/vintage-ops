{% extends 'base.html' %}{% block body %}<h1>Create an item</h1><p class="muted">Add garment details and local photos. Your SKU is assigned automatically.</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><section><h2>Photos</h2><div id="drop" style="border:2px dashed #ad8d68;padding:2rem;text-align:center;border-radius:8px"><strong>Drop photos here</strong><br>or choose files<input id="photos" name="photos" type="file" accept="image/*" multiple required></div><div class="photos" id="previews"></div><small>Up to {{max_photos}}; permitted: {{extensions|join(', ')}}.</small></section><section><div class="grid"><label>Title<input name="title" value="{{values.get('title','')}}" required></label><label>Price<input name="price" inputmode="decimal" value="{{values.get('price','')}}" placeholder="24.00" required></label></div><label>Description<textarea name="description" rows="5" required>{{values.get('description','')}}</textarea></label><div class="grid"><label>Brand<input name="brand" value="{{values.get('brand','')}}"></label><label>Size<input name="size" value="{{values.get('size','')}}"></label><label>Color<input name="color" value="{{values.get('color','')}}"></label><label>Condition<input name="condition" value="{{values.get('condition','')}}" required></label><label>Category<input name="category" value="{{values.get('category','')}}" required></label></div><button class="primary">Create item</button></section></form><script>const input=document.querySelector('#photos'),drop=document.querySelector('#drop'),out=document.querySelector('#previews');let chosen=[];function sync(){const dt=new DataTransfer();chosen.forEach(f=>dt.items.add(f));input.files=dt.files;out.innerHTML='';chosen.forEach((f,i)=>{const box=document.createElement('div'),img=document.createElement('img'),b=document.createElement('button');img.src=URL.createObjectURL(f);img.alt=f.name;b.type='button';b.textContent='Remove';b.onclick=()=>{chosen.splice(i,1);sync()};box.append(img,b);out.append(box)})}input.onchange=()=>{chosen=[...input.files].slice(0,{{max_photos}});sync()};['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.style.background='#f1e8db'}));drop.addEventListener('dragleave',()=>drop.style.background='');drop.addEventListener('drop',e=>{e.preventDefault();drop.style.background='';chosen=[...chosen,...e.dataTransfer.files].slice(0,{{max_photos}});sync()});</script>{% endblock %}
