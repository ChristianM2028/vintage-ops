{% extends 'base.html' %}{% block body %}<h1>Create an item</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Photos<input name="photos" type="file" accept="image/*" multiple required></label><small>Up to {{max_photos}}; permitted: {{extensions|join(', ')}}.</small><label>Title<input name="title" value="{{values.get('title','')}}" required></label><label>Price<input name="price" value="{{values.get('price','')}}" required></label><label>Description<textarea name="description" required>{{values.get('description','')}}</textarea></label>{% include '_metadata_fields.html' %}<button class="primary">Create item</button></form>{% endblock %}
