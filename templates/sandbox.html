{% extends 'base.html' %}{% block body %}<h1>eBay Sandbox lifecycle</h1><p>Status: <strong>{{ 'Connected' if authenticated else 'Not connected' }}</strong></p><a href="{{url_for('authorize')}}">Authorize Sandbox seller</a><form method="post" action="{{url_for('sandbox_setup')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button {% if not authenticated %}disabled{% endif %}>Set up Sandbox seller</button></form>{% if not setup %}<p>No persisted seller setup yet.</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Title<input name="title" value="{{values.get('title','TEST ONLY - Vintage denim jacket')}}" required></label><label>Description<textarea name="description">{{values.get('description','Sandbox test garment — not for real sale.')}}</textarea></label><label>Price<input name="price" value="{{values.get('price','19.99')}}" required></label><label>Public HTTPS photo URL<input name="photo_url" type="url" value="{{values.get('photo_url','')}}" required></label>{% include '_metadata_fields.html' %}<button {% if not setup %}disabled{% endif %}>List fake item</button></form>{% endblock %}
