<fieldset class="metadata-fields"><legend>eBay category details</legend><label>Search categories<input id="category-search" value="{{ values.get('category_name') or values.get('category','') }}" autocomplete="off" placeholder="e.g. men’s denim jacket"></label><div id="category-suggestions" role="listbox"></div><input type="hidden" id="category" name="category" value="{{ values.get('category','') }}"><input type="hidden" id="category-name" name="category_name" value="{{ values.get('category_name','') }}"><p id="selected-category">{% if values.get('category') %}Selected: {{ values.get('category_name') or values.get('category') }}{% else %}Select a named leaf category.{% endif %}</p><label>Condition <select id="condition" name="condition" data-current="{{ values.get('condition','') }}" required><option value="">Select a category first</option></select></label><div id="aspects" data-specifics='{{ submitted_specifics|default({})|tojson }}'></div><p id="metadata-error" class="error" hidden></p></fieldset><script src="{{ url_for('static',filename='item_metadata.js') }}" defer></script>
