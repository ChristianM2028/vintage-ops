{% extends 'base.html' %}{% block body %}<h1>Edit {{item.sku}}</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% for field in ['title','description','price','quantity','condition','category','brand','size','color'] %}<label>{{field|title}}{% if field == 'description' %}<textarea name="{{field}}" required>{{values[field]}}</textarea>{% else %}<input name="{{field}}" value="{{values[field]}}" {% if field in ['title','price','quantity','condition','category'] %}required{% endif %}>{% endif %}</label>{% endfor %}<label>Item specifics (JSON object)<textarea name="item_specifics">{{specifics}}</textarea></label><label>Replace photos (optional; selected order is preserved)<input type="file" name="photos" multiple accept="image/*"></label><p>Leave photos empty to retain existing photos and their display order.</p><button>Save edits</button></form>{% endblock %}
