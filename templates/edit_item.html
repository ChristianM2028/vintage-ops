{% extends 'base.html' %}{% block body %}<h1>Edit {{item.sku}}</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% for field in ['title','description','price','quantity'] %}<label>{{field|title}}{% if field == 'description' %}<textarea name="{{field}}" required>{{values[field]}}</textarea>{% else %}<input name="{{field}}" value="{{values[field]}}" required>{% endif %}</label>{% endfor %}{% include '_metadata_fields.html' %}<label>Replace photos (optional)<input type="file" name="photos" multiple accept="image/*"></label><button>Save edits</button></form>{% endblock %}
