name: CI
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt
      - name: Complete test suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv|instance|uploads|__pycache__)(/|$)' .
      - name: Migration smoke test
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_PATH="$RUNNER_TEMP/migration.sqlite3"
          export UPLOAD_DIRECTORY="$RUNNER_TEMP/uploads"
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from db import Database
          from config import Config
          cfg = Config()
          Database(cfg.database_path).migrate()
          Database(cfg.database_path).migrate()
          expected = sorted(path.name for path in Path('migrations').glob('*.sql'))
          with sqlite3.connect(cfg.database_path) as connection:
              actual = [row[0] for row in connection.execute(
                  'SELECT version FROM schema_migrations ORDER BY version')]
          assert actual == expected
          assert len(actual) == len(set(actual))
          PY
      - name: Deployment contract gate
        run: python -m pytest -q tests/test_deployment.py tests/test_live_commerce_contract.py
